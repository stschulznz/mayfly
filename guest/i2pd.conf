## guest/i2pd.conf - disposable I2P client, eepsites only.
## Every key below exists in i2pd 2.56.0 (Debian trixie). An unknown key is FATAL,
## so never copy options from newer documentation without checking them against
## tests/fixtures/i2pd-2.56.0-options.txt.
## There is deliberately NO outproxy: clearnet requests are refused by the router.

daemon = false
log = stdout
loglevel = warn
# certsdir is needed because the router runs as a user, not as a service.
certsdir = /usr/share/i2pd/certificates

ipv4 = true
ipv6 = false
nat = true
floodfill = false
# 256 KB/s; a browser needs more than the 32 KB/s default class.
bandwidth = 256
# Client only: accept no transit tunnels for other people.
notransit = true

[ntcp2]
enabled = true
published = false

[ssu2]
enabled = true
published = false

[http]
# Web console: loopback only; the launcher reads it to see when the router is ready.
enabled = true
address = 127.0.0.1
port = 7070

[httpproxy]
enabled = true
address = 127.0.0.1
port = 4444
# A page must never be able to offer a name-to-address mapping for the address book.
addresshelper = false
senduseragent = false

[socksproxy]
enabled = false

[sam]
enabled = false

[bob]
enabled = false

[i2cp]
enabled = false

[i2pcontrol]
enabled = false

[upnp]
enabled = false

[reseed]
verify = true
threshold = 25

[addressbook]
enabled = true

[persist]
profiles = false
addressbook = false

[limits]
transittunnels = 0

[nettime]
enabled = false
frompeers = true

[meshnets]
yggdrasil = false

[trust]
enabled = false
